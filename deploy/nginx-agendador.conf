# /etc/nginx/sites-available/agendador  (depois: ln -s ../sites-available/agendador /etc/nginx/sites-enabled/)
# Troque o server_name pelo subdominio escolhido. HTTPS: sudo certbot --nginx -d SEU-DOMINIO.com.br
server {
    listen 80;
    server_name SEU-DOMINIO.com.br;

    client_max_body_size 1024M;      # videos grandes
    client_body_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;     # upload vai direto pro app, sem copia extra em disco

    location / {
        proxy_pass http://127.0.0.1:5070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
